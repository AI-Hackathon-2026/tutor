name: Deploy on push to develop

on:
  push:
    branches: [develop]
    
jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env files from secrets
        run: |
          # .env
          cat > .env <<EOF
          token=${{ secrets.TOKEN }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          EOF

          # graph_agent.env
          cat > graph_agent.env <<EOF
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          EOF

          # sandbox_environment.env
          cat > sandbox_environment.env <<EOF
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          EOF

          # test_agent.env
          cat > test_agent.env <<EOF
          LANGFUSE__SECRET_KEY=${{ secrets.LANGFUSE__SECRET_KEY }}
          LANGFUSE__PUBLIC_KEY=${{ secrets.LANGFUSE__PUBLIC_KEY }}
          LANGFUSE__OTEL_TIMEOUT=${{ secrets.LANGFUSE__OTEL_TIMEOUT }}
          EOF

          # admin_panel.env (пустой)
          touch admin_panel.env

      - name: Build and restart Docker Compose stack
        run: |
          docker compose down -v
          docker compose up -d --build
